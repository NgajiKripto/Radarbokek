<!-- Map Scripts -->
<script crossorigin="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Map Initialization
            const map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([-6.200000, 106.816666], 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Add Zoom Control at bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Custom Marker Logic
            const createCustomIcon = (type) => {
                let color = 'bg-radar-yellow';
                let icon = 'restaurant';
                let extraClass = '';
                let opacity = 'opacity-100';

                if (type === 'pro') {
                    color = 'bg-chili-red text-white';
                    icon = 'verified';
                    extraClass = 'marker-pulse';
                } else if (type === 'muted') {
                    color = 'bg-surface-variant';
                    icon = 'speed';
                    opacity = 'opacity-50';
                }

                return L.divIcon({
                    className: 'custom-div-icon',
                    html: `
                        <div class="relative w-10 h-10 flex items-center justify-center border-2 border-ink ${color} ${extraClass} ${opacity} transition-all">
                            <span class="material-symbols-outlined text-xl">${icon}</span>
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-ink rotate-45"></div>
                        </div>
                    `,
                    iconSize: [40, 44],
                    iconAnchor: [20, 44]
                });
            };

            // Dummy Data for Markers
            const vendors = [
                { lat: -6.2000, lng: 106.8166, type: 'pro', name: 'Sate Pak Kumis' },
                { lat: -6.1980, lng: 106.8200, type: 'standard', name: 'Bakso Mas Joni' },
                { lat: -6.2020, lng: 106.8150, type: 'muted', name: 'Es Podeng Cepat' },
                { lat: -6.1950, lng: 106.8100, type: 'standard', name: 'Nasi Goreng Gila' }
            ];

            vendors.forEach(v => {
                L.marker([v.lat, v.lng], { icon: createCustomIcon(v.type) }).addTo(map);
            });
        });

        // Simple interaction for the bottom sheet
        const bottomSheet = document.querySelector('.bottom-sheet-gradient + div');
        if(bottomSheet) {
            bottomSheet.addEventListener('click', () => {
                console.log('Vendor detail clicked');
                // Intent: Open detailed vendor profile
            });
        }
    </script>
