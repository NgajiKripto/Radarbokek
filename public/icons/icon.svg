<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#FF5733"/>
  <!-- Radar rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#fff" stroke-width="12" opacity="0.9"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fff" stroke-width="10" opacity="0.7"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#fff" stroke-width="8" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="24" fill="#fff"/>
  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="420" y2="120" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <!-- Cart icon -->
  <g transform="translate(340, 160) scale(0.6)">
    <rect x="10" y="30" width="60" height="40" rx="8" fill="none" stroke="#fff" stroke-width="8"/>
    <circle cx="28" cy="80" r="10" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="52" cy="80" r="10" fill="none" stroke="#fff" stroke-width="6"/>
    <line x1="10" y1="30" x2="0" y2="0" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
